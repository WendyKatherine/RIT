{% load static %}
<header class="site-header">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
  <div class="site-header-inner">
    <a class="brand" href="/" aria-label="RIT Enterprise — inicio">
      <img src="{% static 'img/logo-rit-color.png' %}" alt="RIT Enterprise Solutions">
    </a>
    <nav class="site-nav" aria-label="Navegación principal">
      {% for item in nav %}
      <a href="{{ item.href }}" {% if request.path == item.href %}class="active" aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a class="btn header-cta" href="/contacto">Cotizar</a>
    <label class="nav-burger" for="nav-toggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </label>
  </div>
  <nav class="nav-panel" aria-label="Menú móvil">
    {% for item in nav %}
    <a href="{{ item.href }}" {% if request.path == item.href %}style="color:var(--red)"{% endif %}>{{ item.label }}</a>
    {% endfor %}
    <a class="btn" href="/contacto">Cotizar</a>
  </nav>
</header>

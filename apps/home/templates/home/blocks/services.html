{% load icons %}
<section class="section section--dark" id="servicios" data-carousel>
  <div class="svc-bg" aria-hidden="true"></div>

  <div class="svc-head">
    <div>
      <span class="badge badge--dark rit-rv">03 · Servicios</span>
      <h2 class="h-display h-display--lg h-display--white rit-rv" style="margin-top:20px;max-width:22ch">Soluciones que <span class="grad-text--hero">impulsan</span> tu empresa</h2>
    </div>
    <div class="svc-pager rit-rv">
      <span class="svc-index">
        <span class="svc-current">01</span>
        <span class="slash">/</span> <span class="svc-total">{{ self.cards|length|stringformat:"02d" }}</span>
      </span>
      <div class="svc-arrows">
        <button type="button" class="icon-btn icon-btn--ghost" data-carousel-prev aria-label="Servicio anterior">←</button>
        <button type="button" class="icon-btn icon-btn--ghost" data-carousel-next aria-label="Servicio siguiente">→</button>
      </div>
    </div>
  </div>

  <div class="svc-view">
    {# Sin JS esto es un scroll horizontal con snap; con JS, carrusel infinito #}
    <div class="svc-rail" data-carousel-track>
      {% for c in self.cards %}
      {% include "home/blocks/_svc_card.html" with c=c %}
      {% endfor %}
    </div>
  </div>
</section>

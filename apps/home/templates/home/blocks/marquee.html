{% load marcas %}
<div class="mq" aria-hidden="true">
  <div class="mq-track">
    {% for i in "12" %}
      {% for t in self.items %}
      <span class="mq-item">{% marca_logo t as logo %}{% marca_slug t as brand %}{% if logo %}<img src="{{ logo }}" alt="{{ t }}" data-brand="{{ brand }}" loading="lazy">{% else %}{{ t }}{% endif %}<span class="sep">✦</span></span>
      {% endfor %}
    {% endfor %}
  </div>
</div>

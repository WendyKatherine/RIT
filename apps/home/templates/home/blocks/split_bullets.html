<section class="section section--light">
  <div class="container">
    <div class="split">
      <div>
        {% if value.badge %}<span class="badge badge--bar">{{ value.badge }}</span>{% endif %}
        {% if value.title %}<h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px">{{ value.title }}</h2>{% endif %}
        {% if value.intro %}<p class="sec-lead">{{ value.intro }}</p>{% endif %}
      </div>
      <div class="split-items">
        {% for it in value.items %}
        <div class="split-item">
          <h3>{{ it.title }}</h3>
          <p>{{ it.body }}</p>
        </div>
        {% endfor %}
      </div>
    </div>
    {% if value.note %}<p class="split-note">{{ value.note }}</p>{% endif %}
  </div>
</section>

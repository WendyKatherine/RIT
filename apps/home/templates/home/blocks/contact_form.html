<section class="section section--light">
  <div class="container">
    <span class="badge badge--bar">{{ value.badge }}</span>
    <h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px;max-width:24ch">{{ value.title }}</h2>

    {# Maqueta del formulario: los campos y el envío los cablea el back (Wendy) #}
    <div class="form-card" style="margin-top:48px">
      <label class="field--half"><span>Nombre *</span><input type="text" name="nombre" placeholder="Tu nombre"></label>
      <label class="field--half"><span>Empresa *</span><input type="text" name="empresa" placeholder="Tu empresa"></label>
      <label class="field--half"><span>Email *</span><input type="email" name="email" placeholder="tu@empresa.com"></label>
      <label class="field--half"><span>Teléfono</span><input type="tel" name="telefono" placeholder="+57 ..."></label>
      <label class="field"><span>Servicio de interés *</span>
        <select name="servicio">
          <option>Multicloud e Infraestructura</option>
          <option>Ciberseguridad</option>
          <option>Comunicaciones Avanzadas</option>
          <option>Espacios de Trabajo Inteligentes</option>
          <option>Digitalización de Procesos</option>
          <option>Productos Dell</option>
          <option>Consultoría</option>
          <option>Otro</option>
        </select>
      </label>
      <label class="field"><span>Mensaje</span><textarea name="mensaje" rows="5" placeholder="Cuéntanos tu reto..."></textarea></label>
      {% if value.note %}
      <label class="field" style="display:flex;gap:10px;align-items:flex-start">
        <input type="checkbox" name="habeas" style="width:auto;margin-top:2px">
        <span style="text-transform:none;letter-spacing:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.7)">{{ value.note }} <a href="{{ value.privacy_href }}">Política de Tratamiento de Datos</a>.</span>
      </label>
      {% endif %}
      <div class="field"><button class="btn" type="button">Enviar mensaje</button></div>
    </div>
  </div>
</section>

<section class="section section--deep">
  <div class="stats-bg-dots" aria-hidden="true"></div>
  <div class="container" style="position:relative">
    <span class="badge badge--dark rit-rv">{{ value.badge }}</span>
    <h2 class="h-display h-display--lg h-display--white rit-rv" style="margin-top:20px;max-width:24ch">{{ value.title }}</h2>
    <div class="reasons-grid">
      {% for it in value.items %}
      <div class="reason-card rit-rv">
        <h3>{{ it.title }}</h3>
        <p>{{ it.body }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

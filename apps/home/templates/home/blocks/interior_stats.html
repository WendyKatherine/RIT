<section class="section section--light">
  <div class="stats-bg-dots" aria-hidden="true"></div>
  <div class="stats-bg-glow" aria-hidden="true"></div>
  <div class="container" style="position:relative">
    <span class="badge badge--bar">{{ value.badge }}</span>
    <h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px;max-width:24ch">{{ value.title }}</h2>
    <div class="stats-grid">
      {% for st in value.stats %}
      <div class="stat-card">
        <div class="stat-value">{{ st.pre }}{{ st.count }}{{ st.post }}</div>
        <div class="stat-label">{{ st.label }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

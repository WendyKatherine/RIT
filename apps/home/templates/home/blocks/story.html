<section class="section section--light">
  <div class="container">
    <div class="story-grid">
      <div>
        <span class="badge badge--bar rit-rv">{{ value.badge }}</span>
        <h2 class="h-display h-display--lg h-display--navy rit-rv" style="margin-top:20px">{{ value.title_pre }} {% if value.title_hi %}<span class="grad-text">{{ value.title_hi }}</span>{% endif %}</h2>
      </div>
      <div class="rit-rv" style="display:flex;flex-direction:column;gap:18px">
        {% for p in value.paragraphs %}<p class="lead" style="margin:0">{{ p }}</p>{% endfor %}
      </div>
    </div>
  </div>
</section>

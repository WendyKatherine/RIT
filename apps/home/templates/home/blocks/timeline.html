<section class="section section--light">
  <div class="container">
    {% if value.badge %}<span class="badge badge--bar">{{ value.badge }}</span>{% endif %}
    {% if value.title %}<h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px;max-width:30ch">{{ value.title }}</h2>{% endif %}
    <ol class="timeline">
      {% for s in value.steps %}
      <li class="tl-step">
        <div class="tl-dot" aria-hidden="true"></div>
        <div class="tl-body">
          <h3>{{ s.title }}</h3>
          {% if s.body %}<p>{{ s.body }}</p>{% endif %}
        </div>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>

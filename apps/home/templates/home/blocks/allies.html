<section class="section section--light">
  <div class="container" style="text-align:center">
    {% if value.badge %}<span class="badge badge--bar">{{ value.badge }}</span>{% endif %}
    {% if value.title %}<h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px">{{ value.title }}</h2>{% endif %}
    {% if value.subtitle %}<p class="sec-lead" style="margin-left:auto;margin-right:auto">{{ value.subtitle }}</p>{% endif %}
    <div class="allies">
      {% for it in value.items %}<div class="ally">{{ it }}</div>{% endfor %}
    </div>
  </div>
</section>

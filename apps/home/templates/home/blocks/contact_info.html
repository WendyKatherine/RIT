<section class="section section--light">
  <div class="container">
    <span class="badge badge--bar">{{ value.badge }}</span>
    <h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px;max-width:24ch">{{ value.title }}</h2>
    <div class="values-grid">
      {% for c in value.cards %}
      <article class="value-item">
        <h3>{{ c.k }}</h3>
        {% if c.href %}<p><a href="{{ c.href }}">{{ c.v }}</a></p>{% else %}<p>{{ c.v }}</p>{% endif %}
      </article>
      {% endfor %}
    </div>
  </div>
</section>

<section class="section section--light">
  <div class="stats-bg-dots" aria-hidden="true"></div>
  <div class="stats-bg-glow" aria-hidden="true"></div>
  <div class="container" style="position:relative">
    <span class="badge badge--bar rit-rv">{{ value.badge|default:"02 · Resultados" }}</span>
    <h2 class="h-display h-display--lg h-display--navy rit-rv" style="margin-top:20px;max-width:24ch">{{ value.title_pre|default:"Números que respaldan nuestra" }} <span class="grad-text">{{ value.title_hi|default:"experiencia." }}</span></h2>
    <div class="stats-grid">
      {% for st in self.stats %}
      <div class="stat-card rit-rv">
        <div class="stat-num c-{{ st.count }}" style="--target:{{ st.count }}" data-pre="{{ st.pre }}" data-post="{{ st.post }}"><span>{{ st.pre }}{{ st.count }}{{ st.post }}</span></div>
        <div class="stat-label">{{ st.label }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

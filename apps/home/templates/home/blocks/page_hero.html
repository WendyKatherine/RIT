<section class="hero hero--interior">
  <div class="hero-bg-glow" aria-hidden="true"></div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="hero-interior">
    <span class="badge badge--dark">{{ value.badge }}</span>
    <h1 class="h-display h-display--xl h-display--white">{{ value.title_pre }} {% if value.title_hi %}<span class="grad-text--hero">{{ value.title_hi }}</span>{% endif %}</h1>
    {% if value.lead %}<p class="hero-lead">{{ value.lead }}</p>{% endif %}
    {% if value.cta_label %}
    <div class="hero-ctas"><a class="btn btn--white btn--pill-icon" href="{{ value.cta_href }}">{{ value.cta_label }} <span class="btn-ico">→</span></a></div>
    {% endif %}
  </div>
</section>

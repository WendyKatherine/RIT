<section class="page-hero">
  <div class="page-hero-dots" aria-hidden="true"></div>
  <div class="page-hero-glow" aria-hidden="true"></div>
  <div class="container page-hero-inner">
    <span class="badge badge--dark rit-rv">{{ value.badge }}</span>
    <h1 class="h-display h-display--lg h-display--white rit-rv">{{ value.title_pre }} {% if value.title_hi %}<span class="grad-text--hero">{{ value.title_hi }}</span>{% endif %}</h1>
    {% if value.lead %}<p class="page-hero-lead rit-rv">{{ value.lead }}</p>{% endif %}
    {% if value.cta_label %}
    <div class="rit-rv" style="margin-top:28px"><a class="btn" href="{{ value.cta_href }}">{{ value.cta_label }}</a></div>
    {% endif %}
  </div>
</section>

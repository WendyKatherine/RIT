<section class="section section--dark">
  <div class="container" style="max-width:900px;text-align:center">
    {% if value.badge %}<span class="badge badge--dark">{{ value.badge }}</span>{% endif %}
    <h2 class="h-display h-display--lg h-display--white" style="margin-top:20px">{{ value.title }}</h2>
    {% if value.body %}<p class="sec-lead sec-lead--dark">{{ value.body }}</p>{% endif %}
    {% if value.cta_label %}<div style="margin-top:28px"><a class="btn btn--white" href="{{ value.cta_href }}">{{ value.cta_label }}</a></div>{% endif %}
  </div>
</section>

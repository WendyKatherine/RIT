{% load wagtailcore_tags %}
<section class="section section--light">
  <div class="container">
    <span class="badge badge--bar">{{ value.badge|default:"Soluciones" }}</span>
    <h2 class="h-display h-display--lg h-display--navy" style="margin-top:20px;max-width:26ch">{{ value.title|default:"Nuestras soluciones" }}</h2>
    <div class="values-grid">
      {% for child in page.get_children.live %}
      <article class="value-item">
        <h3><a href="{% pageurl child %}">{{ child.title }}</a></h3>
      </article>
      {% endfor %}
    </div>
  </div>
</section>

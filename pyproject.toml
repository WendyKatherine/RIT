[project]
name = "rit-website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2.0",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.4",
    "wagtail~=7.4.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Los settings usan `from .base import *` (patrón del template) — F403/F405 lo ven como error
"config/settings/*.py" = ["F403", "F405"]
# urls.py importa estáticos dentro de `if settings.DEBUG` — E402
"config/urls.py" = ["E402"]
# Iconos: los SVGs son datos de una línea, la regla de longitud no aplica
"apps/common/templatetags/icons.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# Código generado/boilerplate: no aporta valor tipearlo estricto
module = ["manage", "config.settings.*", "*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Librerías sin stubs (Wagtail y dependencias no exponen py.typed) — su import queda como Any
module = ["wagtail", "wagtail.*", "modelcluster.*", "taggit.*", "treebeard.*", "modelsearch.*", "django_filters.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests", "apps"]

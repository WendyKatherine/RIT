services:
  postgres:
    image: postgres:16-alpine
    container_name: rit-postgres
    environment:
      POSTGRES_USER: rit
      POSTGRES_PASSWORD: rit
      POSTGRES_DB: rit_website
    ports:
      - "5433:5432" # host 5433 para no chocar con el 5432 de travel-savings
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rit -d rit_website"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: rit-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose, el host de Postgres es el nombre del servicio
      DATABASE_URL: postgres://rit:***@postgres:5432/rit_website
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media # uploads del admin persistidos (no dentro del contenedor)

volumes:
  pgdata:
  media:
